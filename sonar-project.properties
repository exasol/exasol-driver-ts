sonar.host.url=https://sonarcloud.io
sonar.projectKey=@exasol/exasol-driver-ts
sonar.organization=exasol

sonar.sources=src/
sonar.exclusions=**/*.spec.*.ts,**/*.spec.ts,**/*.js
sonar.tests=src/,integration-test/
sonar.test.inclusions=**/*.spec.*.ts,**/*.spec.ts
sonar.coverage.exclusions=src/lib/mock-socket.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-browser/lcov.info

# These files register shared integration scenarios; their test cases are defined in integration-test/testcases/.
sonar.issue.ignore.multicriteria=s2187BrowserCompression,s2187BrowserPool,s2187BrowserResourceManagement,s2187NodeResourceManagement
sonar.issue.ignore.multicriteria.s2187BrowserCompression.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187BrowserCompression.resourceKey=integration-test/browser/compression.browser.spec.ts
sonar.issue.ignore.multicriteria.s2187BrowserPool.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187BrowserPool.resourceKey=integration-test/browser/pool.browser.spec.ts
sonar.issue.ignore.multicriteria.s2187BrowserResourceManagement.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187BrowserResourceManagement.resourceKey=integration-test/browser/resource-management.browser.spec.ts
sonar.issue.ignore.multicriteria.s2187NodeResourceManagement.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187NodeResourceManagement.resourceKey=integration-test/node/resource-management.spec.ts
